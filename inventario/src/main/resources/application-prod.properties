spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ── Supabase Connection Pooler (Session mode, IPv4) ──────────
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-init-sql=SELECT 1
# SSL requerido por Supabase
spring.datasource.hikari.data-source-properties.sslmode=require
# Compatibilidad con pgBouncer/Pooler — desactiva prepared statements a nivel driver
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true


spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


jwt.secret=${JWT_SECRET}
jwt.expiration=28800000
jwt.expiration.remember=2592000000


admin.cedula=${ADMIN_CEDULA}
admin.password=${ADMIN_PASSWORD}
admin.nombre=${ADMIN_NOMBRE}
admin.correo=${ADMIN_CORREO}


# ── Facturación electrónica ───────────────────────────────────
# Por defecto "mock". Cuando tengas credenciales reales de Siigo,
# agrega en Render: FACTURACION_PROVEEDOR=siigo (sin redeploy de código)
facturacion.proveedor=${FACTURACION_PROVEEDOR:mock}

siigo.api.url=https://api.siigo.com
siigo.api.username=${SIIGO_USERNAME:sin-configurar}
siigo.api.access-key=${SIIGO_ACCESS_KEY:sin-configurar}
siigo.api.partner-id=${SIIGO_PARTNER_ID:sin-configurar}
siigo.api.documento-id=${SIIGO_DOCUMENTO_ID:41628}
siigo.api.nc-documento-id=${SIIGO_NC_DOCUMENTO_ID:41629}
siigo.api.nd-documento-id=${SIIGO_ND_DOCUMENTO_ID:14978}
siigo.api.pago-id=${SIIGO_PAGO_ID:9238}
siigo.api.iva19-id=${SIIGO_IVA19_ID:8053}
siigo.api.iva5-id=${SIIGO_IVA5_ID:8054}

spring.mail.host=smtp.sendgrid.net
spring.mail.port=587
spring.mail.username=apikey
spring.mail.password=${SENDGRID_API_KEY:sin-configurar}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Datos empresa y resolución DIAN ─────────────────────────
# Sin defaults: el servidor no arranca si no están configurados.
# Cuando el DIAN renueve la resolución, solo cambia estas variables en Render.
empresa.nit=${EMPRESA_NIT}
empresa.resolucion.numero=${EMPRESA_RESOLUCION_NUMERO}
empresa.resolucion.fecha=${EMPRESA_RESOLUCION_FECHA}
empresa.resolucion.prefijo=${EMPRESA_RESOLUCION_PREFIJO}
empresa.resolucion.desde=${EMPRESA_RESOLUCION_DESDE}
empresa.resolucion.hasta=${EMPRESA_RESOLUCION_HASTA}
empresa.resolucion.vigencia=${EMPRESA_RESOLUCION_VIGENCIA}

# ── CORS: dominio del frontend ───────────────────────────────
# REQUERIDO — configura CORS_ORIGINS en las variables de entorno del servidor.
# Ejemplo: https://distriasociados.vercel.app
# Sin valor por defecto: el servidor NO arranca si esta variable no está definida.
app.cors.allowed-origins=${CORS_ORIGINS}

# ── Backup ───────────────────────────────────────────────────
# Render tiene filesystem efímero — los backups no persisten entre deploys.
# Supabase ya hace backups automáticos de la BD. Se desactiva aquí.
backup.habilitado=false
backup.directorio=/tmp/backups
backup.pgdump-path=pg_dump