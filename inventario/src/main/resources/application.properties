# ================================
# COMUN - aplica en todos los ambientes
# ================================
spring.application.name=inventario
server.port=8080

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Zona horaria Colombia — evita que LocalDate.now() devuelva el día anterior
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
server.tomcat.timezone=America/Bogota

app.cors.allowed-origins=http://192.168.0.11:5173,http://localhost:5173,http://localhost:4173

remision.prefijo=REM
factura.prefijo=FEV

# ── Datos empresa para PDF facturas electrónicas ──────────────
empresa.nombre=DISTRIASOCIADOS SAS
empresa.nit=${EMPRESA_NIT:901.897.762-1}
empresa.direccion=CRA 3 N 21A 64 BARRIO SAN FERNANDO BODEGA
empresa.telefono=(602) 3178547638
empresa.ciudad=La Union - Colombia
empresa.correo=distriasociados2024@gmail.com
empresa.ciiu=4632
empresa.actividad=Comercio al por mayor de bebidas y tabaco
# Resolución DIAN — en producción estas variables se configuran en el servidor (no en código)
empresa.resolucion.numero=${EMPRESA_RESOLUCION_NUMERO:18764089740671}
empresa.resolucion.fecha=${EMPRESA_RESOLUCION_FECHA:20250227}
empresa.resolucion.prefijo=${EMPRESA_RESOLUCION_PREFIJO:FEV}
empresa.resolucion.desde=${EMPRESA_RESOLUCION_DESDE:1}
empresa.resolucion.hasta=${EMPRESA_RESOLUCION_HASTA:2000}
empresa.resolucion.vigencia=${EMPRESA_RESOLUCION_VIGENCIA:24 Meses}

# ── Backups automáticos ───────────────────────────────────────
# Directorio donde se guardan los backups (ruta relativa al jar o absoluta)
backup.directorio=./backups
# Días que se conservan los backups antes de eliminarse
backup.retener-dias=30
# Hora del backup automático: todos los días a las 2:00 AM Colombia
backup.cron=0 0 2 * * *
# Poner en false para desactivar los backups automáticos
backup.habilitado=true
# Ruta al ejecutable pg_dump — se sobreescribe por perfil (dev/prod)
# En dev: application-dev.properties define la ruta de Windows
# En prod: application-prod.properties usa "pg_dump" (ya en PATH de Linux)
backup.pgdump-path=pg_dump

# Perfil activo - cambiar a prod en el servidor
spring.profiles.active=dev