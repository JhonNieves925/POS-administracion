services:
  - type: web
    name: distriasociados-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/auth/ping
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Las siguientes se configuran en el dashboard de Render (NO aquí por seguridad)
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_CEDULA
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NOMBRE
        sync: false
      - key: ADMIN_CORREO
        sync: false
      - key: CORS_ORIGINS
        sync: false
